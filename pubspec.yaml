name: habit_tracker
description: Good & Bad Habit Tracker with Supabase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.0

  # Local Storage (cache offline)
  hive_flutter: ^1.1.0

  # Notifikasi
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

  # UI — semua icon pakai Material Icons & emoji bawaan Flutter
  gap: ^3.0.1                  # spacing helper
  fl_chart: ^0.67.0            # grafik statistik
  table_calendar: ^3.1.0       # kalender heatmap
  intl: ^0.19.0                # format tanggal/waktu

  # Utils
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  # Tidak perlu assets — semua icon pakai emoji + Material Icons bawaan Flutter
